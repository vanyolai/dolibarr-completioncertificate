name: PHP lint

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Guard external-module dropdown URLs
        run: |
          if grep -nE "'url'[[:space:]]*=>[[:space:]]*'/completioncertificate/" class/actions_completioncertificate.class.php; then
            echo "External-module dropdown URLs must use urlroot/urlraw with dol_buildpath(..., 1), not a core-relative url."
            exit 1
          fi
          grep -F "'urlroot' => dol_buildpath('/completioncertificate/card.php', 1)" class/actions_completioncertificate.class.php

      - name: Guard PDF footer pagebreak handling
        run: |
          grep -F "setAutoPageBreak(true, 0);" core/modules/completioncertificate/doc/pdf_standard_certificate.modules.php
          if grep -nE "SetAutoPageBreak\(true,[[:space:]]*\$this->marge_basse" core/modules/completioncertificate/doc/pdf_standard_certificate.modules.php; then
            echo "Dolibarr pdf_pagefoot must not be rendered inside an automatic bottom-margin break zone."
            exit 1
          fi
      - name: Guard native order tab badge
        run: |
          grep -F "CompletionCertificates,Certificate,/completioncertificate/class/certificate.class.php,getOrderCertificateCount" core/modules/modCompletionCertificate.class.php

      - name: Guard native confirmation flows
        run: |
          grep -F "\$deleteUrl = '';" card.php
          grep -F "\$deleteButtonId = 'action-delete';" card.php
          grep -F "'InvalidateCompletionCertificate'), 'default'" card.php
          if grep -nF "'InvalidateCompletionCertificate'), 'delete'" card.php; then
            echo "Invalidation is a status transition, not a delete-style action."
            exit 1
          fi

      - name: Guard core-style footer rendering
        run: |
          grep -F "setPageOrientation('', true, 0);" core/modules/completioncertificate/doc/pdf_standard_certificate.modules.php
          grep -F "return \$this->_pagefoot(\$pdf, \$object, \$outputlangs, \$hidefreetext);" core/modules/completioncertificate/doc/pdf_standard_certificate.modules.php
          if grep -nE "\$this->_pagefoot\(\$pdf, \$object, \$outputlangs" core/modules/completioncertificate/doc/pdf_standard_certificate.modules.php | grep -v "return"; then
            echo "Direct footer calls are forbidden; use _writePageFooter() so the reserved bottom margin is cleared first."
            exit 1
          fi
